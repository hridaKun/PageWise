name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Pagewise.exe and the installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Pagewise
          path: |
            dist/Pagewise.exe
            dist/PagewiseSetup-*.exe

      # Pushing a tag like v1.1.1 publishes a GitHub Release with the installer.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PagewiseSetup-*.exe
            dist/Pagewise.exe
