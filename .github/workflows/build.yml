name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Pagewise.exe and the installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Pagewise-Windows
          path: |
            dist/Pagewise.exe
            dist/PagewiseSetup-*.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb speech-dispatcher espeak-ng

      - name: Build the app and the .deb
        run: linux/build.sh

      - name: Test the app end to end
        # Read aloud is skipped: CI machines have no sound device.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node linux/test/e2e.js --no-speech

      - name: Test installing the .deb
        run: |
          sudo apt-get install -y ./dist/pagewise_*_amd64.deb
          test -u /opt/pagewise/chrome-sandbox
          sudo apt-get remove -y pagewise

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Pagewise-Linux
          path: dist/pagewise_*_amd64.deb

  # Pushing a tag like v1.1.1 publishes a GitHub Release with both installers.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PagewiseSetup-*.exe
            dist/Pagewise.exe
            dist/pagewise_*_amd64.deb
